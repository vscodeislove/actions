name: Build → Push to Docker Hub → Deploy Cloud Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: vscodeislove
          password: ${{ secrets.DOCKER_LOGIN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: vscodeislove/nextjs:${{ github.sha }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: pivotal-canto-478409-u3
          export_default_credentials: true

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy nextjs  \
            --image "docker.io/vscodeislove/nextjs:${{ github.sha }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
